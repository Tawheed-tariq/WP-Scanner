services:
  mongodb:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  api:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/vuln-scanner/backend
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/

  ui:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/vuln-scanner/frontend


volumes:
  mongodb-data:
